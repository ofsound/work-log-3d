<svg width="1024" height="1024" viewBox="96 96 832 832" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Full-bleed home-screen artwork: crop to the tile and omit the clock shadow. -->
  <defs>
    <!-- Background Gradient from icon-new -->
    <linearGradient id="bgGrad" x1="96" y1="96" x2="928" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E6EA3" />
      <stop offset="100%" stop-color="#0A2D4A" />
    </linearGradient>

    <!-- Clock Face Radial Gradient from icon-new -->
    <radialGradient id="faceGrad" cx="10" cy="11" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C2E4FF" />
      <stop offset="40%" stop-color="#81C4FF" />
      <stop offset="100%" stop-color="#3A92DF" />
    </radialGradient>
  </defs>

  <g>
    <!-- Background square gradients and inner border from icon-new -->
    <rect x="96" y="96" width="832" height="832" rx="184" fill="url(#bgGrad)" />
    <rect x="100" y="100" width="824" height="824" rx="180" fill="none" stroke="#3D9EE4" stroke-opacity="0.4" stroke-width="4" />

    <!-- Center the clock face horizontally at x=512; preserve its original vertical placement. -->
    <g>
      <g transform="translate(176, 190) scale(28)" stroke="#FFFFFF" stroke-width="1.64" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="14" r="8" fill="url(#faceGrad)" />
        <line x1="12" y1="2" x2="12" y2="6" />
        <line x1="9.5" y1="1.5" x2="14.5" y2="1.5" stroke-width="2.46" />
        <line x1="12" y1="10" x2="12" y2="14" />
        <line x1="4.5" y1="6.5" x2="6.34" y2="8.34" />
      </g>
    </g>
  </g>
</svg>
